<!DOCTYPE html>
<html lang="tr">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Selam - Hoş Geldiniz</title>
   <style>
       body, html {
           height: 100%;
           margin: 0;
           display: flex;
           justify-content: center;
           align-items: center;
           background-color: #1a1a1a;
           font-family: Arial, sans-serif;
       }
       .greeting-container {
           text-align: center;
           padding: 2rem;
           background-color: #2a2a2a;
           border-radius: 10px;
           box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
       }
       .greeting-text {
           color: #ffffff;
           font-size: 3rem;
           margin-bottom: 1rem;
           font-weight: bold;
       }
       .subtitle {
           color: #cccccc;
           font-size: 1.2rem;
           margin-bottom: 0.5rem;
       }
       .welcome-message {
           color: #aaaaaa;
           font-size: 1rem;
       }
   </style>
</head>
<body>
   <div class="greeting-container">
       <div class="greeting-text">Selam!</div>
       <div class="subtitle">Hoş Geldiniz</div>
       <div class="welcome-message">Küçük Web Uygulamamıza Hoş Geldiniz</div>
   </div>
</body>
</html>
